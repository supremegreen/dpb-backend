<script type="module">
  /* ================================
     🔐 FIXED TOKEN VERIFY (NON-BLOCKING)
  ================================= */
  const params = new URLSearchParams(window.location.search)
  const token = params.get('token') || sessionStorage.getItem('active_token')

  if (!token) {
    window.location.href = 'index.html'
  }

  sessionStorage.setItem('active_token', token)

  // 🔥 NON-BLOCKING VERIFY
  fetch(`https://dpb-backend-dfc6.onrender.com/verify-token?token=${token}`)
    .then(res => res.json())
    .then(data => {
      if (!data.valid) window.location.href = 'index.html'
    })

  /* ================================
     EVERYTHING ELSE BELOW UNCHANGED
  ================================= */
