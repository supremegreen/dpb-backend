<script>
  /* 🔐 SAFE TOKEN CHECK (NON-BREAKING) */
  const params = new URLSearchParams(window.location.search)
  const token = params.get('token')

  if (!token) {
    window.location.href = 'index.html'
  } else {
    sessionStorage.setItem('active_token', token)
  }

  // 🔥 VERIFY IN BACKGROUND (DO NOT BLOCK UI)
  fetch(`https://dpb-backend-dfc6.onrender.com/verify-token?token=${token}`)
    .then(res => res.json())
    .then(data => {
      if (!data.valid) window.location.href = 'index.html'
    })
    .catch(() => {
      window.location.href = 'index.html'
    })

  /* ================================
     ORIGINAL CAMERA CODE (UNCHANGED)
  ================================= */

  let stream
  let currentFacingMode = 'environment'
  let photoBlob

  const video = document.getElementById('video')
  const canvas = document.getElementById('previewCanvas')
  const ctx = canvas.getContext('2d')

  const captureBtn = document.getElementById('captureBtn')
  const flipBtn = document.getElementById('flipBtn')
  const retakeBtn = document.getElementById('retake')
  const approveBtn = document.getElementById('approve')

  async function startCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop())
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: currentFacingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        aspectRatio: { ideal: 16 / 9 }
      }
    })

    video.srcObject = stream
    video.style.transform =
      currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)'
  }

  window.onload = startCamera

  flipBtn.onclick = () => {
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'
    startCamera()
  }

  captureBtn.onclick = () => {
    canvas.width = video.videoWidth
    canvas.height = video.videoHeight

    if (currentFacingMode === 'user') {
      ctx.translate(canvas.width, 0)
      ctx.scale(-1, 1)
    }

    ctx.drawImage(video, 0, 0)
    ctx.setTransform(1, 0, 0, 1, 0, 0)

    canvas.toBlob(
      blob => {
        photoBlob = blob

        video.style.display = 'none'
        canvas.style.display = 'block'

        captureBtn.style.display = 'none'
        flipBtn.style.display = 'none'

        retakeBtn.style.display = 'flex'
        approveBtn.style.display = 'flex'
      },
      'image/jpeg',
      1.0
    )
  }

  retakeBtn.onclick = () => {
    video.style.display = 'block'
    canvas.style.display = 'none'

    captureBtn.style.display = 'block'
    flipBtn.style.display = 'flex'

    retakeBtn.style.display = 'none'
    approveBtn.style.display = 'none'
  }

  approveBtn.onclick = () => {
    const reader = new FileReader()
    reader.onloadend = () => {
      localStorage.setItem('photo', reader.result)

      // 🔥 FIX: PASS TOKEN
      window.location.href = `editor.html?token=${token}`
    }
    reader.readAsDataURL(photoBlob)
  }
</script>
